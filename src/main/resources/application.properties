spring.application.name=kanban-api
# Profile
spring.profiles.active=dev
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_USER_PASSWORD}
# Security
spring.security.jwt.expiration=${SECURITY_JWT_EXPIRATION}
spring.security.jwt.secret=${SECURITY_JWT_SECRET}
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}
# Admin user
spring.admin.user.email=${ADMIN_USER_EMAIL}
spring.admin.user.firstName=${ADMIN_USER_FIRST_NAME}
spring.admin.user.lastName=${ADMIN_USER_LAST_NAME}
spring.admin.user.password=${ADMIN_USER_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Swagger Path
springdoc.swagger-ui.path=/swagger-ui.html